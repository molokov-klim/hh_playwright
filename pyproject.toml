[project]
name = "hh-playwright"
version = "1.2.1"
description = "Автоматизация откликов на hh.ru с использованием Playwright"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "k.molokov", email = "ultrakawaii9654449192@gmail.com" },
]
dependencies = [
    "playwright==1.57.0",
    "loguru==0.7.3",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "greenlet==3.3.0",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pyee==13.0.0",
    "pygments==2.19.2",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.10",
    "mypy==1.16.0",
    "pre-commit==5.0.0",
    "black==25.1.0",
]

# ---------- UV ----------
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'windows'",
    "sys_platform == 'linux'"
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "black",
]

# ---------- RUFF ----------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "E203", # пробел перед ":" в срезах
    "D203", # пустые строки вокруг docstring
    "D212", # пустые строки в блоках docstring
    "E501", # строка слишком длинная
    "W293", # пустые строки содержат пробелы
    "N802", # Function name `test_RNDAGB` should be lowercase
    "N999", # Invalid module name: 'test_RNDAGB'
    "RUF002", # CYRILLIC
    "RUF001", # CYRILLIC
    "RUF003", # CYRILLIC
    "D203", # conflict D
    "D212", # conflict D
    "FBT", # Boolean-typed argument in function definition
    "PLR0913", #  Too many arguments in function definition (10 > 5)
    "PLR0915", # Too many statements (137 > 50)
    "S101", # assert
    "G004", # Logging statement uses f-string (loguru рекомендует f-строки)
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument (pytest fixtures)
    "ARG004", # Unused static method argument
    "TD001", # Invalid
    "TD002", # Missing author in
    "TD003", # Missing issue link
    "TD004", # Missing colon in
    "FIX001", # Line contains
    "FIX002", # Line contains
    "SLF001", # Private member access (Singleton pattern)
    "A002", # Builtin argument shadowing
    "ANN401", # Dynamically typed expressions (Any)
    "D102", # Missing docstring in public method (__new__)
    "INP001", # Add an `__init__.py
    "COM812", # Trailing comma missing (conflicts with formatter)
]

exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "debug*.py",
    "**/__pycache__",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "build",
    "dist",
    "debug*",
    "tests",
    "tests/*",
    "**/tests",
    "**/tests/*",
    "**/test*",
    "**/test*/*",
    "**/test*.py",
    "**/test*/*.py",
]

# Опционально авто-правки:
[tool.ruff.format]
preview = true

# ---------- MYPY ----------
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "venv/",
    "tests/",
    "debug*",
]

# ---------- PYTEST ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-slv --tb=short --setup-show"
#-v (или --verbose) — включает подробный вывод, показывая названия тестов и их статус (PASSED, FAILED и т. д.).
#--tb=short — настраивает формат трассировки ошибок (traceback):
#short — выводит укороченный traceback, только ключевые строки с ошибкой (меньше "шума" по сравнению с полным выводом).
#Другие варианты: --tb=auto (по умолчанию), --tb=long, --tb=line, --tb=native, --tb=no (вообще не показывать).
